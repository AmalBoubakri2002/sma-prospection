services:
  - type: web
    name: sma-prospection-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # Base Neon (postgresql+asyncpg://...?ssl=require) — à saisir dans le dashboard Render.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      # Fusionne worker_pipeline + orchestrateur dans ce même processus : le
      # free tier ne permet pas de "background workers" séparés (voir app/main.py).
      - key: RUN_WORKERS_IN_PROCESS
        value: "true"
      # Domaine du frontend (Cloudflare Pages), ex: '["https://sma-prospection.pages.dev"]'
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: INSEE_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: INPI_USERNAME
        sync: false
      - key: INPI_PASSWORD
        sync: false
