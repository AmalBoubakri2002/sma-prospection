services:
  postgres:
    image: postgres:16-alpine
    container_name: sma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sma_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sma_password}
      POSTGRES_DB: ${POSTGRES_DB:-sma_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-sma_user} -d ${POSTGRES_DB:-sma_db} -c 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
