services:

  postgres:
    image: postgres:16-alpine
    container_name: sma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sma_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sma_password}
      POSTGRES_DB: ${POSTGRES_DB:-sma_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-sma_user} -d ${POSTGRES_DB:-sma_db} -c 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: sma-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sma_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sma_user}:${POSTGRES_PASSWORD:-sma_password}@postgres:5432/${POSTGRES_DB:-sma_db}
      ODOO_URL: http://odoo:8069
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Tous les workers partagent la même image "sma-backend" buildée une seule fois.

  worker-pipeline:
    image: sma-backend
    container_name: sma_worker_pipeline
    restart: unless-stopped
    command: python -m app.workers.worker_pipeline
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sma_user}:${POSTGRES_PASSWORD:-sma_password}@postgres:5432/${POSTGRES_DB:-sma_db}
      ODOO_URL: http://odoo:8069
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy

  orchestrateur:
    image: sma-backend
    container_name: sma_orchestrateur
    restart: unless-stopped
    command: python -m app.workers.orchestrateur
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sma_user}:${POSTGRES_PASSWORD:-sma_password}@postgres:5432/${POSTGRES_DB:-sma_db}
      ODOO_URL: http://odoo:8069
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy

  odoo-db:
    image: postgres:16-alpine
    container_name: sma_odoo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ODOO_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      POSTGRES_DB: postgres
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ODOO_DB_USER:-odoo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  odoo:
    image: odoo:17.0
    container_name: sma_odoo
    restart: unless-stopped
    ports:
      - "8069:8069"
    environment:
      HOST: odoo-db
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
    volumes:
      - odoo_web_data:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons
    depends_on:
      odoo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8069/web/login >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  odoo_db_data:
  odoo_web_data:
