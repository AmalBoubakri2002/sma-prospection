[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "sma-prospection-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy>=2.0.36",
    "greenlet>=3.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    # Auth
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.12",
    # Validation / Config
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    # HTTP client (agents, API SIRENE, etc.)
    "httpx>=0.27.2",
    # Extraction données structurées (JSON-LD, Microdata) — MIT
    "extruct>=0.17.0",
    # Validation / normalisation numéros de téléphone (Google libphonenumber) — Apache 2.0
    "phonenumbers>=8.13.0",
    # Scraping JS-heavy (Playwright headless, optionnel) — Apache 2.0
    # Après pip install : exécuter `playwright install chromium`
    "playwright>=1.40.0",
    # Orchestration multi-agents
    "langgraph>=0.2.0",
    # ML — scoring XGBoost
    "numpy>=1.24.0",
    "xgboost>=2.0.0,<3.0.0",
    "joblib>=1.3.0",
    # Calibration isotonique post-hoc du score (predictor.py charge un
    # IsotonicRegression sérialisé) — nécessaire à l'inférence, pas seulement
    # à l'entraînement, contrairement à pandas ci-dessous.
    "scikit-learn>=1.3.0",
    # LLM — génération d'emails (Agent Rédaction) via NVIDIA API (OpenAI-compatible)
    "openai>=1.0.0",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    # ML training (local seulement, pas en Docker) — scikit-learn est monté en
    # dépendance de prod ci-dessus (nécessaire à l'inférence, pas seulement au
    # training), il ne doit pas rester ici en double.
    "pandas>=2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
